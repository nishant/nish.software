# Checks for pull requests. The `check` steps copy the check job in deploy.yml; keep them in
# step. The Fold check is its own workflow, fold.yml.
name: PR

on:
  pull_request:

permissions: { contents: read }

concurrency: { group: "pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
