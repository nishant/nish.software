# Push to main = deploy nish.software. `check` runs on GitHub's runners; `deploy` runs
# on the self-hosted runner installed on the hosting PC (labels: self-hosted, windows,
# nish-software), which pulls into C:\Apps\nish.software and builds dist/ for Caddy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    runs-on: [self-hosted, windows, nish-software]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git refuses to fetch from a shallow clone ("shallow roots")
      # The live checkout fetches from this job's workspace rather than from GitHub, the
      # same way the private repos deploy (the runner runs as SYSTEM).
      # Explicit shell line: a self-hosted runner inherits the machine's execution
      # policy (Restricted for SYSTEM on a Windows client), which blocks the default
      # `shell: powershell` wrapper. Bypass applies to this process only.
      - name: Deploy to the live checkout
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: .\scripts\deploy.ps1 -Target C:\Apps\nish.software -FetchFrom "$env:GITHUB_WORKSPACE"
