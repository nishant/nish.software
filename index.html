<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nish</title>
    <meta name="description" content="Nish's apps, projects and resume." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta property="og:title" content="Nish" />
    <meta property="og:description" content="Apps, projects and resume." />
    <meta property="og:url" content="https://nish.software/" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Theme before first paint: no flash. localStorage -> OS preference -> dark. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') t = saved;
          else if (matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#apps">Skip to apps</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
